name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
      - name: Bundle .app
        run: zsh Scripts/build-app.sh
